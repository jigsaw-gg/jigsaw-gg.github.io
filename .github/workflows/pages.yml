# Build Vite app and deploy to GitHub Pages.
# Optional repository variables (Settings → Variables):
#   VITE_GAME_HTTP_URL, VITE_GAME_WEBTRANSPORT_URL, VITE_GAME_WEBSOCKET_URL
# Set repository VITE_GAME_* variables for production; client fallbacks are
# 127.0.0.1 when unset. Relay probe URLs are derived from the play origins (`/relay`, `/ws`).
# OTEL is never inlined here: vite production mode clears OTEL_* so the Pages
# bundle has no exporter credentials or SDK chunk.
#
# The same build plants the first 6 characters of the commit and the
# `git log -1` text as Vite constants for the About page.
#
# Also enable Pages: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          VITE_GAME_HTTP_URL: ${{ vars.VITE_GAME_HTTP_URL }}
          VITE_GAME_WEBTRANSPORT_URL: ${{ vars.VITE_GAME_WEBTRANSPORT_URL }}
          VITE_GAME_WEBSOCKET_URL: ${{ vars.VITE_GAME_WEBSOCKET_URL }}
        run: |
          export BUILD_COMMIT="${GITHUB_SHA:0:6}"
          export BUILD_COMMIT_LOG="$(git --no-pager log -1 --no-color)"
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
