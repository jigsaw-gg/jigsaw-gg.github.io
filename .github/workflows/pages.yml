# Build Vite app and deploy to GitHub Pages.
# Set repository variables APINATOR_APP_KEY and APINATOR_APP_SECRET
# (Settings → Secrets and variables → Actions → Variables).
# The build inlines both. The page signs private-channel subscriptions
# locally; GitHub Pages has no auth route. Do not read either value from secrets.
#
# The same build plants the first 6 characters of the commit and the
# `git log -1` text as Vite constants for the About page.
#
# Also enable Pages: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          VITE_APINATOR_APP_KEY: ${{ vars.APINATOR_APP_KEY }}
          APINATOR_APP_SECRET: ${{ vars.APINATOR_APP_SECRET }}
        run: |
          if [ -z "${VITE_APINATOR_APP_KEY}" ]; then
            echo "::error::Repository variable APINATOR_APP_KEY is not set."
            echo "Define it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ -z "${APINATOR_APP_SECRET}" ]; then
            echo "::error::Repository variable APINATOR_APP_SECRET is not set."
            echo "Define it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          export BUILD_COMMIT="${GITHUB_SHA:0:6}"
          export BUILD_COMMIT_LOG="$(git --no-pager log -1 --no-color)"
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
