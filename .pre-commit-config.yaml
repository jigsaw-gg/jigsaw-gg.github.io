default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^.*\.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: eslint-local
        name: eslint-local
        entry: bash -c 'npx eslint .'
        language: system
        types: [file]
        files: \.(ts|tsx)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: pretrier-local
        name: pretrier-local
        entry: bash -c 'npx lint-staged --all'
        language: system
        types: [file]
        files: \.(ts|tsx|json|css|md|html)$
        pass_filenames: false
