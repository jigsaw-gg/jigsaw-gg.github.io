default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^.*\.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: eslint-local
        name: eslint-local
        entry: bash -c 'npx eslint apps/web'
        language: system
        types: [file]
        files: \.(ts|tsx)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: pretrier-local
        name: pretrier-local
        entry: bash -c 'npx lint-staged --all'
        language: system
        types: [file]
        files: \.(ts|tsx|json|css|md|html)$
        pass_filenames: false

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        name: rustfmt
        files: ^apps/server/.*\.rs$
        args: [--manifest-path=apps/server/Cargo.toml, --]
      - id: cargo-check
        name: cargo-check
        files: ^apps/server/.*\.(rs|toml)$
        args:
          - --manifest-path=apps/server/Cargo.toml
          - --config
          - build.warnings="deny"
        pass_filenames: false
      - id: clippy
        name: clippy
        files: ^apps/server/.*\.(rs|toml)$
        args:
          - --manifest-path=apps/server/Cargo.toml
          - --all-targets
          - --
          - -D
          - warnings
        pass_filenames: false
