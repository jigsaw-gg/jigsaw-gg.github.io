syntax = "proto3";

package relay.v1;

option java_multiple_files = true;

// =============================================================================
// Architecture
//
// WebTransport / WebSocket are *transports* — opaque pipes that carry bytes
// (or framed StreamFrames for game play). They are not RPCs.
//
// This package defines the only remaining relay-plane RPC. Application RPCs
// live in `game.v1` and are served over HTTP (:21100); play streams ride
// WebTransport or WebSocket `/game`.
// =============================================================================

service RelayControl {
  // Lightweight liveness check. Echoes nonce and returns server time.
  rpc Ping(PingRequest) returns (PongResponse);
}

message PingRequest {
  // Optional client-supplied token echoed back in PongResponse.
  string nonce = 1;
}

message PongResponse {
  string nonce = 1;
  // Server Unix time in milliseconds when the pong was produced.
  int64 server_time_ms = 2;
}
