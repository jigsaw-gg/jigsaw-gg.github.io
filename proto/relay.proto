syntax = "proto3";

package relay.v1;

option java_multiple_files = true;

// Control-plane service: room membership + WebRTC signaling.
// The data plane (arbitrary binary payloads) travels over
// WebTransport datagrams/streams, WebRTC DataChannels, WebSocket,
// or raw TCP/UDP sockets.
service RelayControl {
  // Join a broadcast room. Creates the room if it does not exist.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Leave a broadcast room.
  rpc Leave(LeaveRequest) returns (LeaveResponse);

  // List peers currently connected in a room.
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);

  // Bidirectional WebRTC signaling stream (SDP + ICE).
  rpc Signal(stream SignalFrame) returns (stream SignalFrame);

  // Health / capability probe.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);

  // Lightweight liveness check. Echoes nonce and returns server time.
  rpc Ping(PingRequest) returns (PongResponse);
}

message JoinRequest {
  string room_id = 1;
  // Optional stable id; server assigns one when empty.
  string client_id = 2;
  TransportPreference preferred_transport = 3;
}

message JoinResponse {
  string client_id = 1;
  string room_id = 2;
  repeated PeerInfo peers = 3;
}

message LeaveRequest {
  string room_id = 1;
  string client_id = 2;
}

message LeaveResponse {}

message ListPeersRequest {
  string room_id = 1;
}

message ListPeersResponse {
  repeated PeerInfo peers = 1;
}

message PeerInfo {
  string client_id = 1;
  TransportKind transport = 2;
}

enum TransportKind {
  TRANSPORT_KIND_UNSPECIFIED = 0;
  TRANSPORT_KIND_WEBTRANSPORT = 1;
  TRANSPORT_KIND_WEBRTC = 2;
  TRANSPORT_KIND_WEBSOCKET = 3;
  TRANSPORT_KIND_TCP = 4;
  TRANSPORT_KIND_UDP = 5;
}

enum TransportPreference {
  TRANSPORT_PREFERENCE_UNSPECIFIED = 0;
  TRANSPORT_PREFERENCE_WEBTRANSPORT = 1;
  TRANSPORT_PREFERENCE_WEBRTC = 2;
  TRANSPORT_PREFERENCE_WEBSOCKET = 3;
  TRANSPORT_PREFERENCE_TCP = 4;
  TRANSPORT_PREFERENCE_UDP = 5;
  TRANSPORT_PREFERENCE_AUTO = 6;
}

message SignalFrame {
  string room_id = 1;
  string client_id = 2;
  // Peer this signal is addressed to (empty = server / any).
  string target_client_id = 3;
  oneof body {
    SessionDescription sdp = 10;
    IceCandidate ice = 11;
    SignalError error = 12;
    SignalReady ready = 13;
  }
}

message SessionDescription {
  // "offer" or "answer"
  string type = 1;
  string sdp = 2;
  // When true, request an unordered/unreliable DataChannel (UDP-like).
  bool unreliable = 3;
}

message IceCandidate {
  string candidate = 1;
  string sdp_mid = 2;
  int32 sdp_mline_index = 3;
}

message SignalError {
  string message = 1;
}

message SignalReady {
  string client_id = 1;
}

message PingRequest {
  // Optional client-supplied token echoed back in PongResponse.
  string nonce = 1;
}

message PongResponse {
  string nonce = 1;
  // Server Unix time in milliseconds when the pong was produced.
  int64 server_time_ms = 2;
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  bool webtransport = 1;
  bool webrtc = 2;
  bool websocket = 3;
  bool tcp = 4;
  bool udp = 5;
  string webtransport_url = 10;
  string websocket_url = 11;
  string grpc_endpoint = 12;
  uint32 tcp_port = 13;
  uint32 udp_port = 14;
  uint32 webrtc_udp_port = 15;
}

// Optional framed envelope if a client wants metadata on the data plane.
// All transports also accept raw arbitrary bytes without this wrapper.
message Envelope {
  string client_id = 1;
  string room_id = 2;
  int64 timestamp_ms = 3;
  bytes payload = 4;
}
