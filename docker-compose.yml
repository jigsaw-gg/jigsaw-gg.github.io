# Game server — same ports/certs/env as `./manage.sh run-rust-server-local`.
# Run from repo root: docker compose up --build

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-server-placeholder-commit}
        BUILD_COMMIT_LOG: ${BUILD_COMMIT_LOG:-server-placeholder-commit-log}
        # fast profile — override with CARGO_PROFILE=release for optimized images
        CARGO_PROFILE: ${CARGO_PROFILE:-fast}
    image: jigsaw-gg-server:${TAG:-latest}
    container_name: jigsaw-gg-server
    ports:
      - "127.0.0.1:21100:21100/tcp"
      - "127.0.0.1:31100:31100/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .docker.env
        required: false
    environment:
      RUST_LOG: info,jigsaw_gg_server=debug
      HTTP_ADDR: 0.0.0.0:21100
      WEBTRANSPORT_ADDR: 0.0.0.0:31100
      PUBLIC_HOST: 127.0.0.1
      CERT_DIR: /app/certs
      CERT_FILE: /app/certs/localhost+1.pem
      KEY_FILE: /app/certs/localhost+1-key.pem
      DEFAULT_ROOM: default
    volumes:
      - ./apps/server/certs:/app/certs:ro
    restart: unless-stopped
